# External sites sometimes reject automated requests. Keep exclusions scoped to
# one manually verified resource and record the verification date.
max_retries = 3
timeout = 20
user_agent = "Mozilla/5.0 (compatible; AwesomeKyoAniLinkChecker/0.2; +https://github.com/kaoru0822-kitauji/awesome-kyoani)"

